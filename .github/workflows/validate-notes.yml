name: Validate Coach Notes

on:
  pull_request:
    paths:
      - "teams/**/notes/**.csv"
      - "docs/positions.md"
  push:
    branches: ["main"]
    paths:
      - "teams/**/notes/**.csv"
      - "docs/positions.md"

jobs:
  discover-teams:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          teams=$(find teams -maxdepth 1 -mindepth 1 -type d -printf '"%f"\n' | jq -s -c '.')
          echo "matrix={\"team\":$teams}" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover-teams
    if: ${{ needs.discover-teams.outputs.matrix != '{"team":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.discover-teams.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cross-validate notes against matches (${{ matrix.team }})
        run: python scripts/validate_notes.py --team-dir teams/${{ matrix.team }}

name: Check matches.csv is up to date

on:
  pull_request:
    paths:
      - "teams/**/data/raw/dribl/**.xlsx"
      - "scripts/dribl_matches_export_to_csv.py"
      - "requirements.txt"

jobs:
  discover-teams:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          teams=$(find teams -maxdepth 1 -mindepth 1 -type d -printf '"%f"\n' | jq -s -c '.')
          echo "matrix={\"team\":$teams}" >> "$GITHUB_OUTPUT"

  check:
    needs: discover-teams
    if: ${{ needs.discover-teams.outputs.matrix != '{"team":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.discover-teams.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate matches.csv (${{ matrix.team }})
        run: |
          python scripts/dribl_matches_export_to_csv.py --team-dir teams/${{ matrix.team }}

      - name: Ensure generated file is committed
        run: |
          set -e
          CSV="teams/${{ matrix.team }}/data/processed/matches.csv"
          if [ -z "$(git status --porcelain -- "$CSV")" ]; then
            echo "$CSV is up to date."
            exit 0
          fi

          echo "::error file=$CSV::Processed matches.csv is out of date for ${{ matrix.team }}. Run scripts/dribl_matches_export_to_csv.py --team-dir teams/${{ matrix.team }} and commit the result."
          git --no-pager diff HEAD -- "$CSV" || true
          exit 1